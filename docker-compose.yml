services:
  postgres:
    # pgvector rather than the stock image, because `vector` is not among the
    # extensions postgres:18-alpine ships and the search schema (migration 0016)
    # opens with `create extension vector`. Same PostgreSQL 18, same data
    # directory layout — the only difference that reaches the archive is libc,
    # and switching from the alpine image means every text index was built under
    # musl's collation and has to be rebuilt under glibc's. See deploy/README.md.
    image: pgvector/pgvector:pg18
    # photod hard-fails at startup if it cannot ping the database, and systemd
    # brings it up at boot with no ordering against Docker. Without this the
    # container stays exited after a reboot and photod crash-loops forever.
    restart: unless-stopped
    environment:
      POSTGRES_USER: photobackup
      # Read from .env, which is gitignored, because this file is not: it is
      # committed to a public repository, and a password in it is a published
      # password. The `:?` makes a missing value a startup error rather than an
      # empty one — an unset variable here would otherwise reach initdb as a
      # blank password on a fresh volume.
      #
      # Only initdb reads this. Changing it does nothing to a volume that
      # already exists; rotating the password on a live archive is an
      # `alter user` plus DATABASE_URL in /etc/photod/photod.env, and this line
      # is what a future `docker compose down -v` would then rebuild from.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: photobackup
    # Loopback only. This used to be "5432:5432", which binds 0.0.0.0 *and*
    # [::] — and on Fedora Workstation the default firewall zone opens
    # 1025-65535/tcp, so the archive's whole database was reachable from every
    # device on the LAN, and over a globally-routable IPv6 address besides.
    #
    # Nothing off this machine has ever needed it. photod is the only client
    # and it connects over localhost; photo-ml never touches Postgres at all.
    #
    # Both loopback families are published because DATABASE_URL says
    # `localhost`, and which of ::1 and 127.0.0.1 that resolves to first is not
    # something this file should have an opinion about.
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      # postgres:18+ expects the mount one level up, so it can keep
      # major-version-specific subdirectories and support pg_upgrade --link.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobackup"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
