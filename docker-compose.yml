services:
  postgres:
    # pgvector rather than the stock image, because `vector` is not among the
    # extensions postgres:18-alpine ships and the search schema (migration 0016)
    # opens with `create extension vector`. Same PostgreSQL 18, same data
    # directory layout — the only difference that reaches the archive is libc,
    # and switching from the alpine image means every text index was built under
    # musl's collation and has to be rebuilt under glibc's. See deploy/README.md.
    image: pgvector/pgvector:pg18
    # photod hard-fails at startup if it cannot ping the database, and systemd
    # brings it up at boot with no ordering against Docker. Without this the
    # container stays exited after a reboot and photod crash-loops forever.
    restart: unless-stopped
    environment:
      POSTGRES_USER: photobackup
      POSTGRES_PASSWORD: photobackup
      POSTGRES_DB: photobackup
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ expects the mount one level up, so it can keep
      # major-version-specific subdirectories and support pg_upgrade --link.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobackup"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
